[project]
name = "mewbo-demo-seeder"
version = "0.0.14"
description = "Deterministic demo database seeder for Mewbo (demo-as-code)."
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
  { name = "Krishnakanth Alagiri", email = "mail@kanth.tech" },
]
license = { text = "MIT" }

# Runtime deps are exactly what the api image already ships (mewbo_core pulls
# pymongo transitively); the seeder adds nothing new so `python -m
# mewbo_demo_seeder` runs in-container off PYTHONPATH alone.
dependencies = [
  "mewbo-core>=0.0.10",
  "pydantic>=2.7.0,<3.0.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mewbo_demo_seeder"]
