# Both services are RESOURCE-CAPPED. An uncapped redroid inherits the whole host
# (privileged, no cgroup limit) and a runaway inside Android — SwiftShader software
# rendering, a boot loop, a leaking app — will swap the host to death rather than die
# itself. Caps make the container the thing that fails, not the workstation.
# `memswap_limit == mem_limit` is the load-bearing half: it denies the container ANY
# swap, so overrun is a fast in-container OOM (Android's lowmemorykiller reaps it)
# instead of host-wide swap thrash, which is what actually locks up the desktop.
# Sized from measured idle (AOSP ~1.1G / GMS ~1.6G, ~1000 PIDs each) + headroom for
# app + software-GPU rendering. Raise a cap only against an observed OOM, never "to be safe".
services:
  redroid:
    image: redroid/redroid:13.0.0-latest
    container_name: aura-redroid
    privileged: true            # required: binder/ashmem access
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 3g           # == mem_limit ⇒ no swap; see header
    pids_limit: 4096            # idles ~1000; bounds a fork storm
    volumes:
      - ./data:/data            # persists app + system state across restarts
    ports:
      - "5555:5555"             # adbd
    networks:
      - default
      - assistant               # line-of-sight to the deployed Mewbo API stack
    command:
      - androidboot.redroid_width=1440
      - androidboot.redroid_height=3120
      - androidboot.redroid_dpi=560   # Pixel-like geometry
      # Android-side DNS = Docker's embedded resolver: resolves compose service
      # names (http://api:5125) AND forwards LAN names via the host's resolver.
      - androidboot.redroid_net_ndns=1
      - androidboot.redroid_net_dns1=127.0.0.11

  # TV-geometry variant — the SAME AOSP base, booted at 16:9 landscape so D-pad
  # focus traversal can be witnessed on hardware we already run. Opt-in:
  #   docker compose --profile tv up -d
  #   adb connect localhost:5557
  #   adb -s localhost:5557 shell input keyevent 20   # DPAD_DOWN
  # This works because KEYCODE_DPAD_* is dispatched by the input framework and
  # Compose focus responds to key events — neither depends on the leanback
  # feature. What it can NEVER witness: `android.software.leanback` (declared by
  # a permissions XML baked at image build, and /system is read-only), the TV
  # launcher row, banner presentation, or any hasSystemFeature(FEATURE_LEANBACK)
  # branch. Those need a real Google TV emulator image.
  redroid-tv:
    image: redroid/redroid:13.0.0-latest
    container_name: aura-redroid-tv
    profiles: ["tv"]
    privileged: true            # required: binder/ashmem access
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 3g           # == mem_limit ⇒ no swap; see header
    pids_limit: 4096
    volumes:
      - ./data-tv:/data         # separate state from the phone-geometry service
    ports:
      - "5557:5555"             # adbd (5555 base, 5556 gms)
    networks:
      - default
      - assistant
    command:
      - androidboot.redroid_width=1920
      - androidboot.redroid_height=1080
      - androidboot.redroid_dpi=213   # ≈960x540dp landscape; tvdpi-ish
      - androidboot.redroid_net_ndns=1
      - androidboot.redroid_net_dns1=127.0.0.11

  # GMS variant — MindTheGapps baked into the same redroid 13 base so its
  # stock assistant app can run as an assistant-role/overlay UX reference.
  # Opt-in (plain `docker compose up -d` never starts it):
  #   ./build-gms-image.sh                  # one-time image bake
  #   docker compose --profile gms up -d
  #   adb connect localhost:5556
  # First boot: the GMS setup wizard black-screens on redroid's software GPU —
  # skip it once:
  #   adb -s localhost:5556 shell settings put secure user_setup_complete 1
  #   adb -s localhost:5556 shell settings put global device_provisioned 1
  #   adb -s localhost:5556 shell pm disable-user --user 0 com.google.android.setupwizard
  # MindTheGapps ships its assistant app pre-registered as the default assistant
  # (verify: settings get secure assistant → GsaVoiceInteractionService). For
  # account sign-in, register the GSF Android ID at google.com/android/uncertified
  # first. redroid has no mic input → typed/visual assistant interaction only.
  redroid-gms:
    image: redroid/redroid:13.0.0_mindthegapps
    container_name: aura-redroid-gms
    profiles: ["gms"]
    privileged: true            # required: binder/ashmem access
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 4g               # 1g over the AOSP cap: Play Services + the Gemini app
    memswap_limit: 4g           # == mem_limit ⇒ no swap; see header
    pids_limit: 4096
    volumes:
      - ./data-gms:/data        # separate state from the AOSP service
    ports:
      - "5556:5555"             # adbd (base service owns 5555)
    networks:
      - default
      - assistant
    command:
      - androidboot.redroid_width=1440
      - androidboot.redroid_height=3120
      - androidboot.redroid_dpi=560   # Pixel-like geometry
      - androidboot.redroid_net_ndns=1
      - androidboot.redroid_net_dns1=127.0.0.11

# Host's default Docker address pools are fully allocated; pin a free subnet.
networks:
  default:
    ipam:
      config:
        - subnet: 10.213.99.0/24
  assistant:
    external: true
    name: assistant_default
