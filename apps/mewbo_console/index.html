<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Home | Mewbo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/file-icon-vectors@1.0.0/dist/file-icon-vivid.min.css" />
    <script src="/runtime-config.js"></script>
    <!-- Apply the persisted theme before the bundle loads: React syncs the
         class only after first paint, so without this a persisted-light user
         gets a dark first frame (FOUC). Key must stay in lockstep with
         App.tsx's mewbo:theme. -->
    <script>
      try {
        if (localStorage.getItem('mewbo:theme') === 'light') {
          document.documentElement.classList.add('light');
        }
      } catch (e) { /* private browsing etc. — dark default is fine */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
