[project]
name = "mewbo-api"
version = "0.0.14"
description = "REST API Engine wrapped around the Mewbo core."
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
  { name = "Krishnakanth Alagiri", email = "mail@kanth.tech" },
]
license = { text = "MIT" }

dependencies = [
  "mewbo-core>=0.0.10",
  "mewbo-tools>=0.0.10",
  "mewbo-iam>=0.0.1",
  "flask>=3.0.3,<4.0.0",
  "flask-restx>=1.3.0,<2.0.0",
  "gunicorn>=22.0.0",
  "imapclient>=3.0,<4.0",
  "mistune>=3.0,<4.0",
]

[project.optional-dependencies]
# The wiki + search substrate now lives in the optional `mewbo-graph`
# library. This extra forwards to it so the public name and the
# Docker `WIKI_EXTRAS` toggle are unchanged — `mewbo-api[wiki]` still pulls
# tree-sitter + rank-bm25 + numpy, now transitively via mewbo-graph's own
# extras. Base `mewbo-api` installs graph-less; every graph import in the
# api is guarded so the server still boots without this extra.
# Embeddings ride litellm against the LiteLLM proxy (no extra client) —
# see packages/mewbo_graph/src/mewbo_graph/wiki/embedder.py.
wiki = [
    "mewbo-graph[treesitter,retrieval]>=0.0.13",
]
# Gateway-backed speech (synthesis + transcription) lives in the optional
# `mewbo-speech` library. This extra forwards to it so the public name and the
# Docker `SPEECH_EXTRAS` toggle stay in step, mirroring `wiki` above. Base
# `mewbo-api` installs speech-less: `speech/__init__.py` guards the import and
# returns False, so the namespace simply never mounts and the server boots
# clean. That absence IS the availability signal a client reads as a 404.
speech = [
    "mewbo-speech[gateway]>=0.0.1",
]
# DockerContainerBackend (ide.py) — the pre-broker Web IDE path used by the
# existing test suite and by a developer running the API against a local
# daemon with no broker configured. The api image installs WITHOUT this
# extra: the deployed api no longer touches /var/run/docker.sock at all,
# that access having moved to the dedicated mewbo-ide broker service
# (docker/Dockerfile.ide). Dev and CI install it via `--all-extras`.
docker = [
    "docker>=7.0,<8.0",
]

[project.scripts]
mewbo-api = "mewbo_api.backend:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mewbo_api"]
