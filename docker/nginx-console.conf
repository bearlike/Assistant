# Access log WITHOUT the query string, and it is the credential that makes this
# mandatory rather than tidy. `EventSource` cannot set request headers, so every
# SSE stream authenticates with `?api_key=` (`src/api/sse.ts`) — a sound design
# the API supports. nginx's stock `combined` format logs `$request`, which is
# method + FULL URI + protocol, so each stream wrote the live key into the access
# log in plaintext; the console reconnects SSE constantly, so one page visit left
# dozens of copies. `$uri` is the path with the query string already stripped, so
# the log keeps every field an operator reads and loses only the secret.
#
# This sits above `server` because `log_format` is only valid in the `http`
# context, which is where `conf.d/*.conf` is included. Do NOT "fix" the leak by
# moving the key out of the query string — that would break SSE auth.
log_format console_noquery '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status '
                           '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 3001;
    server_name _;

    access_log /var/log/nginx/access.log console_noquery;

    root /usr/share/nginx/html;
    index index.html;

    # Audio uploads are the largest body this proxy carries, and nginx's own
    # default is 1 MiB — ten times SMALLER than the ceiling the API publishes as
    # `transcription.limits.max_audio_bytes`. The console reads that published
    # number for its pre-upload guard, so a recording between the two limits
    # passed the client check and was then refused here, by a proxy neither side
    # consults. Measured: a 1.5 MB upload is 200 straight to the API and 413
    # through this server. Keep this at or above the API's cap; a value below it
    # silently re-opens the gap.
    client_max_body_size 12m;

    # Bare collection endpoint — must be declared even though the prefix block
    # below looks like it covers it: nginx auto-301s a request for a prefix
    # location's path-minus-trailing-slash (`/api/sessions`) onto the slashed
    # form, and Flask 404s `/api/sessions/` (routes are registered without the
    # trailing slash). That breaks session listing AND creation through the
    # proxy. An exact match is checked before prefix locations, so list/create
    # go straight to the API.
    location = /api/sessions {
        proxy_pass http://127.0.0.1:5125;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE streaming — no buffering, long timeout
    location /api/sessions/ {
        proxy_pass http://127.0.0.1:5125;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    # Regular API calls
    location /api/ {
        proxy_pass http://127.0.0.1:5125/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Wiki SSE — disable buffering for indexing + QA event streams.
    location ~ ^/v1/wiki/(index|qa)/[^/]+/stream$ {
        proxy_pass http://127.0.0.1:5125;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    # Wiki API — regular calls.
    location /v1/wiki/ {
        proxy_pass http://127.0.0.1:5125/v1/wiki/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Git credential registry — product-wide, mounted at /v1/git/ rather than
    # under /v1/wiki/ because the wiki is only its first consumer.
    #
    # Without this block the path falls through to the SPA catch-all below and
    # answers 200 with index.html, so the client parses HTML as JSON and the
    # credential list fails with no hint that ROUTING, not the API, was wrong.
    # A relative API base is the default the console ships with, which is what
    # makes the omission reachable rather than theoretical.
    location /v1/git/ {
        proxy_pass http://127.0.0.1:5125/v1/git/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The repository checkout endpoint clones synchronously and is bounded
        # server-side well inside this window. nginx defaults to 60s, which a
        # large repository beats — and the client would then see a 504 with no
        # hint that the clone itself was still running and about to succeed.
        proxy_read_timeout 300s;
    }

    # Fingerprinted build assets — safe to cache forever.
    # Vite emits /assets/<name>-<hash>.{js,css} so a new build = new URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Widget-host build assets. The page itself (/widget-host/widget-host.html)
    # is a real file, so the SPA `location /` block below already serves it via
    # try_files — but its assets live under /widget-host/assets/, which the
    # /assets/ prefix above does NOT match, so they would otherwise inherit the
    # SPA block's `no-cache`. That matters here specifically: the console frames
    # this page to render every Mewbo App, and its stlite bundle is megabytes,
    # so `no-cache` means re-downloading it on each app open. `^~` stops nginx
    # from evaluating the regex locations below for this prefix.
    # Same immutability argument as /assets/: JS/CSS are content-hashed, and the
    # .whl files that deliberately keep unhashed names are version-stamped.
    location ^~ /widget-host/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Vendored Pyodide runtime + boot wheels (scripts/fetch-pyodide.mjs). These
    # are large (~26 MB) with stable, unhashed paths, so cache a day: enough to
    # avoid re-pulling the whole runtime on every widget boot, short enough that
    # a pinned pyodide-version bump propagates within a day. Matches both the
    # React console panel (/pyodide/) and the standalone widget host
    # (/widget-host/pyodide/). NOT precached by the service worker — the PWA
    # globPatterns deliberately exclude .whl/.wasm/.zip/.mjs.
    location ~ ^(/widget-host)?/pyodide/ {
        # This image's stock mime.types has no `mjs` entry, so pyodide.mjs went
        # out as application/octet-stream — and browsers enforce strict MIME
        # checking on ES module scripts, so the whole kernel failed to boot. A
        # `types` block REPLACES the inherited map within this location: list
        # every extension pyodide serves that needs a real type; wheels/zips
        # deliberately fall through to the binary default.
        types {
            text/javascript js mjs;
            application/wasm wasm;
            application/json json;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Service worker, manifest, and runtime config must revalidate every load.
    # Without this, clients on an older SW keep serving stale index.html.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        expires off;
    }
    location = /runtime-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # SPA fallback — index.html is never cached by the browser, so every
    # navigation hits the server and picks up the latest hashed asset URLs.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
